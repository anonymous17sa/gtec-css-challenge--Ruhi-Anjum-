<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <style>
        .container{
            margin: 40px;
        }

        input{
            height: 30px;
            width: 190px;
            color: rgb(68, 67, 67);
            padding-left: 55px;
            padding-top: 8px;
            padding-bottom: 8px;
            font-size: 1.25rem;
            background-color: rgba(195, 193, 193, 0.728);
            border-radius: 10px;
            border: none;

        }

        .fa-solid.fa-magnifying-glass{
            position: absolute;
            top: 50px;
            left: 70px;
            font-size: 1.05rem;
            padding-top: 7px;
            padding-bottom: 8px;
            
            color: black;
        }
    </style>

</head>

<body>
    <div class="container">

        <form>
            <label for="search"></label>
            <i class="fa-solid fa-magnifying-glass"></i><input type="text" id="search" placeholder="Search">
        </form>
    </div>
    <h2>Thank You</h2>
</body>

</html>
